<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+TC:wght@300;400;600;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #050208;
      color: #ffffff;
      font-family: 'Noto Serif TC', serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-sans-modern {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* 頂級純文字立體電影投影（無卡片容器時仍極度清晰） */
    .watermark-text {
      text-shadow: 
        0 2px 10px rgba(0, 0, 0, 0.95),
        0 4px 20px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(0, 0, 0, 0.85);
    }

    .watermark-subtle {
      text-shadow: 
        0 1px 6px rgba(0, 0, 0, 0.9),
        0 2px 14px rgba(0, 0, 0, 0.85);
    }

    /* 王家衛式直書縱排樣式 */
    .vertical-text-layout {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    /* 電影級舞台過渡動態 */
    .cinema-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1), transform 1.1s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }

    .scene-active {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translate3d(0, 0, 0) !important;
      z-index: 20;
    }

    .exit-zoom-out {
      opacity: 0 !important;
      transform: translate3d(0, 0, 0) !important;
    }

    .exit-slide-left {
      opacity: 0 !important;
      transform: translate3d(-4%, 0, 0) !important;
    }

    .enter-zoom-in {
      opacity: 0;
      transform: translate3d(0, 0, 0);
    }

    .enter-slide-right {
      transform: translate3d(4%, 0, 0);
    }

    /* 燭火真實呼吸動態 */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 16px #f59e0b); }
      30% { transform: scale(1.08, 0.95) rotate(2deg); filter: drop-shadow(0 0 24px #fbbf24); }
      60% { transform: scale(0.96, 1.05) rotate(-2deg); filter: drop-shadow(0 0 20px #f59e0b); }
      85% { transform: scale(1.04, 0.98) rotate(1deg); filter: drop-shadow(0 0 26px #fef08a); }
    }

    .flame-on {
      animation: flameFlicker 1.8s infinite ease-in-out;
      transform-origin: center bottom;
    }

    /* 白煙消散動態 */
    @keyframes smokeDrift {
      0% { opacity: 0.9; transform: translateY(0) scale(1) filter(blur(1px)); }
      50% { opacity: 0.6; transform: translateY(-30px) scale(1.5) filter(blur(4px)); }
      100% { opacity: 0; transform: translateY(-70px) scale(2.2) filter(blur(8px)); }
    }

    .smoke-vanish {
      animation: smokeDrift 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 黑膠旋轉動畫 */
    @keyframes vinylSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vinyl-spinning {
      animation: vinylSpin 7s linear infinite;
    }

    .safe-top-inset {
      padding-top: max(var(--safe-top), 16px);
    }

    .safe-bottom-inset {
      padding-bottom: max(var(--safe-bottom), 16px);
    }
  </style>
</head>

    function switchScene(nextIndex) {
      if (isTransitioning) return;
      if (nextIndex < 0 || nextIndex >= CONFIG.scenes.length || nextIndex === currentIndex) return;

      isTransitioning = true;
      const currentEl = document.getElementById(`scene-${currentIndex}`);
      const nextEl = document.getElementById(`scene-${nextIndex}`);

      // 過渡動畫
      const isForward = nextIndex > currentIndex;
      currentEl.className = 'cinema-stage';
      currentEl.classList.add(isForward ? 'exit-slide-left' : 'exit-zoom-out');

      nextEl.className = 'cinema-stage';
      nextEl.classList.add(isForward ? 'enter-slide-right' : 'enter-zoom-in');

      void nextEl.offsetWidth;
      requestAnimationFrame(() => {
        nextEl.classList.add('scene-active');
      });

      // 更新進度條
      document.querySelectorAll('#timelineProgressTrack > div').forEach((bar, idx) => {
        bar.className = `h-[2.5px] flex-1 rounded-full transition-all duration-700 ${idx <= nextIndex ? 'bg-gradient-to-r from-rose-400 to-amber-300' : 'bg-white/20'}`;
      });

      // 更新頂部章節徽章
      sceneBadge.textContent = `第 ${nextIndex + 1} 幕 / 共 ${CONFIG.scenes.length} 幕`;

      // 若切換到第 17 幕，初始化蠟燭事件
      if (CONFIG.scenes[nextIndex].type === 'finale') {
        bindCandleEvent();
      }

      currentIndex = nextIndex;

      setTimeout(() => {
        isTransitioning = false;
      }, 950);
    }

    function initStars() {
      const canvas = document.getElementById('starsCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 65; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.02 + 0.005
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.alpha += Math.sin(Date.now() * s.speed) * 0.015;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 243, 205, ${Math.max(0.1, Math.min(1, s.alpha))})`;
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }
      animate();
    }

    let particles = [];
    let fireworksCanvas, fCtx;

    function initFireworksCanvas() {
      fireworksCanvas = document.getElementById('fireworksCanvas');
      fCtx = fireworksCanvas.getContext('2d');

      function resize() {
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function loop() {
        fCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
          } else {
            fCtx.save();
            fCtx.beginPath();
            fCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            fCtx.fillStyle = p.color.replace('ALP', p.alpha.toFixed(2));
            fCtx.shadowColor = p.glow;
            fCtx.shadowBlur = 10;
            fCtx.fill();
            fCtx.restore();
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    }

    function createExplosion(x, y) {
      const colors = [
        'rgba(244, 63, 94, ALP)',
        'rgba(251, 191, 36, ALP)',
        'rgba(254, 240, 138, ALP)',
        'rgba(217, 70, 239, ALP)',
        'rgba(255, 255, 255, ALP)'
      ];
      const count = 55;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
        const speed = Math.random() * 6 + 2.5;
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.08,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01,
          size: Math.random() * 2.5 + 1.2,
          color: color,
          glow: '#fbbf24'
        });
      }
    }

    function triggerGrandFireworks() {
      const w = fireworksCanvas.width;
      const h = fireworksCanvas.height;
      const shots = [
        { x: w * 0.25, y: h * 0.35, delay: 0 },
        { x: w * 0.75, y: h * 0.32, delay: 250 },
        { x: w * 0.5,  y: h * 0.22, delay: 500 },
        { x: w * 0.2,  y: h * 0.45, delay: 800 },
        { x: w * 0.8,  y: h * 0.42, delay: 1100 },
        { x: w * 0.5,  y: h * 0.3,  delay: 1400 }
      ];

      shots.forEach(s => {
        setTimeout(() => {
          createExplosion(s.x, s.y);
        }, s.delay);
      });
    }

    function initInteractions() {
      // 點擊左側 30% 上一幕，右側 70% 下一幕
      document.getElementById('tapPrevZone').addEventListener('click', () => {
        switchScene(currentIndex - 1);
      });

      document.getElementById('tapNextZone').addEventListener('click', () => {
        switchScene(currentIndex + 1);
      });

      // 觸控滑動手勢
      let startX = 0;
      let startY = 0;

      window.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        const diffY = e.changedTouches[0].clientY - startY;

        // 水平滑動幅度大於 45px 且大於垂直滑動
        if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            switchScene(currentIndex + 1); // 向左滑動下一幕
          } else {
            switchScene(currentIndex - 1); // 向右滑動上一幕
          }
        }
      }, { passive: true });

      // 音樂開關
      musicToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (bgAudio.paused) {
          bgAudio.play().then(() => {
            vinylIcon.classList.add('vinyl-spinning');
          }).catch(() => {});
        } else {
          bgAudio.pause();
          vinylIcon.classList.remove('vinyl-spinning');
        }
      });

      // 開場按鈕放映 (播放連續背景音樂)
      startCinemaBtn.addEventListener('click', () => {
        bgAudio.play().then(() => {
          vinylIcon.classList.add('vinyl-spinning');
        }).catch(err => {
          console.warn('Audio auto-play blocked by system:', err);
        });

        introCurtain.style.opacity = '0';
        setTimeout(() => {
          introCurtain.style.display = 'none';
        }, 1000);
      });
    }

    // 啟動生命週期
    window.addEventListener('DOMContentLoaded', () => {
      initScenes();
      initStars();
      initFireworksCanvas();
      initInteractions();
    });
  </script>
</body>
</html>
