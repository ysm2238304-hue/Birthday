  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --current-accent: #e2e8f0;
      --current-glow: rgba(226, 232, 240, 0.45);
      --current-bg: #03070c;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--current-bg);
      color: #ffffff;
      font-family: 'Noto Serif TC', serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .font-sans-modern { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-code { font-family: 'Space Mono', monospace; }

    /* 電影級文字浮水印投影 */
    .watermark-text {
      text-shadow: 
        0 2px 10px rgba(0, 0, 0, 0.95),
        0 4px 24px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(0, 0, 0, 0.85);
    }

    .watermark-subtle {
      text-shadow: 
        0 1px 6px rgba(0, 0, 0, 0.9),
        0 2px 14px rgba(0, 0, 0, 0.85);
    }

    /* 王家衛式直書縱排 */
    .vertical-text-layout {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    /* 電影舞台推軌轉場 */
    .cinema-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1), transform 0.95s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }

    .scene-active {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translate3d(0, 0, 0) scale(1) !important;
      z-index: 20;
    }

    .exit-zoom-out { opacity: 0 !important; transform: translate3d(8%, 0, 0) scale(0.95) !important; }
    .exit-slide-left { opacity: 0 !important; transform: translate3d(-8%, 0, 0) scale(0.95) !important; }
    .enter-zoom-in { opacity: 0; transform: translate3d(-8%, 0, 0) scale(1.05); }
    .enter-slide-right { transform: translate3d(8%, 0, 0) scale(1.05); }

    /* 燭火真實呼吸動態 */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 16px #fbbf24); }
      30% { transform: scale(1.08, 0.95) rotate(2deg); filter: drop-shadow(0 0 24px #f59e0b); }
      60% { transform: scale(0.96, 1.05) rotate(-2deg); filter: drop-shadow(0 0 20px #d97706); }
      85% { transform: scale(1.04, 0.98) rotate(1deg); filter: drop-shadow(0 0 26px #fde68a); }
    }

    .flame-on {
      animation: flameFlicker 1.8s infinite ease-in-out;
      transform-origin: center bottom;
    }

    /* 白煙消散動態 */
    @keyframes smokeDrift {
      0% { opacity: 0.95; transform: translateY(0) scale(1) filter(blur(1px)); }
      50% { opacity: 0.6; transform: translateY(-35px) scale(1.6) filter(blur(4px)); }
      100% { opacity: 0; transform: translateY(-80px) scale(2.4) filter(blur(8px)); }
    }

    .smoke-vanish { animation: smokeDrift 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* 黑膠旋轉動畫 */
    @keyframes vinylSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vinyl-spinning { animation: vinylSpin 7s linear infinite; }

    .safe-top-inset { padding-top: max(var(--safe-top), 16px); }
    .safe-bottom-inset { padding-bottom: max(var(--safe-bottom), 16px); }

    /* 鐘擺呼吸捲動膠卷 */
    .panoramic-reel-wrapper {
      position: relative;
      width: 100vw;
      margin-left: -1rem;
      margin-right: -1rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 0;
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .panoramic-reel-wrapper::-webkit-scrollbar { display: none; }

    .panoramic-reel-track {
      display: flex;
      gap: 10px;
      width: max-content;
      padding: 0 1.25rem;
      animation: panFilmReelPingPong 26s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
      will-change: transform;
    }

    .panoramic-reel-track:active { animation-play-state: paused; }

    @keyframes panFilmReelPingPong {
      0% { transform: translate3d(0, 0, 0); }
      6% { transform: translate3d(0, 0, 0); }
      94% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      100% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
    }

    .film-frame-card {
      position: relative;
      width: 84px;
      height: 114px;
      border-radius: 4px;
      background: #02090c;
      border: 1px solid rgba(10, 186, 181, 0.55);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8), 0 0 12px rgba(10, 186, 181, 0.25);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px;
    }

    @keyframes beaconGlow {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.35); opacity: 0.25; }
    }

    .beacon-pulse { animation: beaconGlow 1.8s ease-in-out infinite; }

    .ambient-dynamic-halo {
      background: radial-gradient(circle at center, var(--current-glow) 0%, transparent 75%);
      transition: background 1s ease-in-out;
    }

    @keyframes ticketPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(254, 240, 138, 0.2); }
      50% { box-shadow: 0 0 45px rgba(234, 179, 8, 0.8), inset 0 0 25px rgba(254, 240, 138, 0.4); }
    }

    .ticket-glow-btn { animation: ticketPulse 2.8s ease-in-out infinite; }

    /* ✦ 35mm 電影原底片劇照推鏡 (Cinema Still Slide) ✦ */
    .cinema-slide-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(8px);
      filter: blur(4px);
      transition: 
        opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
        transform 3.8s cubic-bezier(0.1, 0.8, 0.25, 1),
        filter 0.8s ease-out;
      will-change: opacity, transform, filter;
    }

    .cinema-slide-active {
      opacity: 1 !important;
      pointer-events: auto !important;
      transform: scale(1.02) translateY(0px) !important;
      filter: blur(0px) !important;
    }

    .cinema-slide-exit {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(1.05) translateY(-6px) !important;
      filter: blur(8px) !important;
      transition: opacity 0.75s ease-in, transform 0.85s ease-in, filter 0.75s ease-in !important;
    }

    /* ✦ 終章電影獻詞黑幕動態 (Cinematic Dedication) ✦ */
    .dedication-line {
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      filter: blur(5px);
      transition: 
        opacity 1.25s cubic-bezier(0.16, 1, 0.3, 1), 
        transform 1.25s cubic-bezier(0.16, 1, 0.3, 1), 
        filter 1.25s ease-out;
      will-change: opacity, transform, filter;
    }

    .dedication-line-show {
      opacity: 1 !important;
      transform: translateY(0) scale(1) !important;
      filter: blur(0px) !important;
    }

    @keyframes goldenBreathe {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.5)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.85)); transform: scale(1.02); }
    }

    .golden-breathe-glow {
      animation: goldenBreathe 3.5s ease-in-out infinite;
    }
  </style>
</head>

    function updateDynamicTheme(index) {
      const scene = CONFIG.scenes[index];
      if (!scene) return;

      const accent = scene.accent || '#e2e8f0';
      const glow = scene.glow || 'rgba(226, 232, 240, 0.45)';
      const bg = scene.bg || '#03070c';

      document.documentElement.style.setProperty('--current-accent', accent);
      document.documentElement.style.setProperty('--current-glow', glow);
      document.documentElement.style.setProperty('--current-bg', bg);
      document.body.style.backgroundColor = bg;

      document.querySelectorAll('#timelineProgressTrack > div').forEach((bar, idx) => {
        if (idx <= index) {
          bar.style.backgroundColor = accent;
          bar.style.boxShadow = `0 0 10px ${accent}`;
          bar.style.opacity = '1';
        } else {
          bar.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
          bar.style.boxShadow = 'none';
          bar.style.opacity = '0.3';
        }
      });

      sceneBadge.textContent = `SCENE ${String(index + 1).padStart(2, '0')} / ${String(CONFIG.scenes.length).padStart(2, '0')}`;
      sceneBadge.style.color = accent;

      if (vinylCenter) vinylCenter.style.backgroundColor = accent;
      if (vinylIcon) vinylIcon.style.borderColor = accent;

      currentStarColor = accent;
    }

    function switchScene(nextIndex) {
      if (isTransitioning) return;
      if (nextIndex < 0 || nextIndex >= CONFIG.scenes.length || nextIndex === currentIndex) return;

      isTransitioning = true;
      const currentEl = document.getElementById(`scene-${currentIndex}`);
      const nextEl = document.getElementById(`scene-${nextIndex}`);

      const tapPrevZone = document.getElementById('tapPrevZone');
      const tapNextZone = document.getElementById('tapNextZone');

      if (CONFIG.scenes[nextIndex].type === 'finale') {
        if (tapNextZone) tapNextZone.style.display = 'none';
        if (tapPrevZone) tapPrevZone.style.display = candleBlown ? 'none' : 'block';
      } else {
        if (tapPrevZone) tapPrevZone.style.display = 'block';
        if (tapNextZone) tapNextZone.style.display = 'block';
      }

      const isForward = nextIndex > currentIndex;
      currentEl.className = 'cinema-stage';
      currentEl.classList.add(isForward ? 'exit-slide-left' : 'exit-zoom-out');

      nextEl.className = 'cinema-stage';
      nextEl.classList.add(isForward ? 'enter-slide-right' : 'enter-zoom-in');

      void nextEl.offsetWidth;
      requestAnimationFrame(() => {
        nextEl.classList.add('scene-active');
      });

      updateDynamicTheme(nextIndex);
      preloadAdjacentPhotos(nextIndex);

      if (CONFIG.scenes[nextIndex].type === 'finale') {
        bindCandleEvent();
      }

      currentIndex = nextIndex;

      setTimeout(() => {
        isTransitioning = false;
      }, 950);
    }

    function showCinemaSlide(targetIndex) {
      const prevIndex = currentMontagePhotoIndex;
      currentMontagePhotoIndex = targetIndex;

      CONFIG.taitungPhotos.forEach((_, pIdx) => {
        const slide = document.getElementById(`taitungSlide-${pIdx}`);
        if (!slide) return;

        if (pIdx === targetIndex) {
          slide.classList.remove('cinema-slide-exit');
          void slide.offsetWidth;
          slide.classList.add('cinema-slide-active');
        } else if (pIdx === prevIndex) {
          slide.classList.remove('cinema-slide-active');
          slide.classList.add('cinema-slide-exit');
        } else {
          slide.classList.remove('cinema-slide-active', 'cinema-slide-exit');
        }
      });
    }

    function clearTaitungTimeline() {
      taitungTimeouts.forEach(t => clearTimeout(t));
      taitungTimeouts = [];
    }

    function startTaitungTimeline() {
      clearTaitungTimeline();
      const taitungVideo = document.getElementById('taitungVideo');
      const taitungVideoDimmer = document.getElementById('taitungVideoDimmer');
      const taitungFinaleStage = document.getElementById('taitungFinaleStage');
      const cinematicEpilogueView = document.getElementById('cinematicEpilogueView');
      const dedicationLine1 = document.getElementById('dedicationLine1');
      const dedicationLine2 = document.getElementById('dedicationLine2');
      const dedicationLine3 = document.getElementById('dedicationLine3');
      const epilogueFooterBlock = document.getElementById('epilogueFooterBlock');
      const replayFinaleBtn = document.getElementById('replayFinaleBtn');

      // 煙火爆發時，徹底淡出頂部導覽列，整片 iOS 頂部天際線 100% 留給煙火
      if (topNavigationBar) {
        topNavigationBar.style.transition = 'opacity 0.6s ease';
        topNavigationBar.style.opacity = '0';
      }

      if (taitungVideo) {
        taitungVideo.currentTime = 0;
        taitungVideo.volume = 0;
        taitungVideo.play().then(() => {
          let vVol = 0;
          const vFade = setInterval(() => {
            vVol = Math.min(1, vVol + 0.18);
            taitungVideo.volume = vVol;
            if (vVol >= 1) clearInterval(vFade);
          }, 35);
        }).catch(e => console.warn('Taitung video play:', e));
      }

      // [ 0.0s ~ 3.5s ] 純淨煙火，頂部天際線毫無遮擋
      // [ 3.5s ~ 7.5s ] 浮現第 1 張 (海邊大笑自拍)
      taitungTimeouts.push(setTimeout(() => {
        if (taitungVideoDimmer) taitungVideoDimmer.style.opacity = '1';
        showCinemaSlide(0);
      }, 3500));

      // [ 7.5s ~ 11.5s ] 第 2 張 (三仙台八拱橋橫照 · 完整呈現不裁切)
      taitungTimeouts.push(setTimeout(() => {
        showCinemaSlide(1);
      }, 7500));

      // [ 11.5s ~ 15.5s ] 第 3 張 (街角嘟嘴耍笨)
      taitungTimeouts.push(setTimeout(() => {
        showCinemaSlide(2);
      }, 11500));

      // [ 15.5s ~ 19.5s ] 第 4 張壓軸 (沙灘愛心影子牽手 · 完整呈現文字與影子)
      taitungTimeouts.push(setTimeout(() => {
        showCinemaSlide(3);
      }, 15500));

      // ✦ [ 19.8s ] 影片尾聲，鋼琴配樂 (bgAudio) 柔和淡入接管 ✦
      taitungTimeouts.push(setTimeout(() => {
        if (bgAudio) {
          bgAudio.volume = 0;
          bgAudio.play().then(() => {
            let resumeVol = 0;
            const resumeFade = setInterval(() => {
              resumeVol = Math.min(0.45, resumeVol + 0.04);
              bgAudio.volume = resumeVol;
              if (resumeVol >= 0.45) clearInterval(resumeFade);
            }, 60);
          }).catch(e => console.warn('BGM resume fade failed:', e));
        }

        // 煙火舞台平滑淡出，切換至電影終章黑幕
        if (taitungFinaleStage) {
          taitungFinaleStage.style.transition = 'opacity 1s ease, transform 1.2s ease';
          taitungFinaleStage.style.opacity = '0';
          taitungFinaleStage.style.transform = 'scale(1.04)';
        }

        setTimeout(() => {
          if (taitungFinaleStage) taitungFinaleStage.style.display = 'none';
          if (cinematicEpilogueView) {
            cinematicEpilogueView.classList.remove('hidden');
            void cinematicEpilogueView.offsetWidth;
            cinematicEpilogueView.classList.remove('opacity-0');
            cinematicEpilogueView.classList.add('opacity-100');
          }
        }, 500);

      }, 19800));

      // ✦ 三拍遞進顯影 ✦
      // 第一拍：第 21.0 秒
      taitungTimeouts.push(setTimeout(() => {
        if (dedicationLine1) dedicationLine1.classList.add('dedication-line-show');
      }, 21000));

      // 第二拍：第 22.8 秒
      taitungTimeouts.push(setTimeout(() => {
        if (dedicationLine2) dedicationLine2.classList.add('dedication-line-show');
      }, 22800));

      // 第三拍：第 24.5 秒 (金色呼吸光暈壓軸)
      taitungTimeouts.push(setTimeout(() => {
        if (dedicationLine3) dedicationLine3.classList.add('dedication-line-show');
      }, 24500));

      // 戳記與重溫按鈕顯影：第 26.0 秒
      taitungTimeouts.push(setTimeout(() => {
        if (epilogueFooterBlock) epilogueFooterBlock.classList.add('dedication-line-show');
      }, 26000));

      if (replayFinaleBtn) {
        replayFinaleBtn.onclick = () => {
          window.location.reload();
        };
      }

      // 支援手勢在 4 張照片間手動滑動
      const carousel = document.getElementById('taitungPhotoCarousel');
      if (carousel) {
        let tStartX = 0;
        carousel.addEventListener('touchstart', (e) => {
          tStartX = e.touches[0].clientX;
        }, { passive: true });

        carousel.addEventListener('touchend', (e) => {
          const diffX = e.changedTouches[0].clientX - tStartX;
          if (Math.abs(diffX) > 40) {
            if (diffX < 0 && currentMontagePhotoIndex < CONFIG.taitungPhotos.length - 1) {
              showCinemaSlide(currentMontagePhotoIndex + 1);
            } else if (diffX > 0 && currentMontagePhotoIndex > 0) {
              showCinemaSlide(currentMontagePhotoIndex - 1);
            }
          }
        }, { passive: true });
      }
    }

    function bindCandleEvent() {
      const flameHitbox = document.getElementById('flameHitbox');
      const candleFlame = document.getElementById('candleFlame');
      const smokeWisp = document.getElementById('smokeWisp');
      const bloomFlash = document.getElementById('bloomFlash');
      const cakeStageView = document.getElementById('cakeStageView');
      const taitungFinaleStage = document.getElementById('taitungFinaleStage');

      if (!flameHitbox || candleBlown) return;

      const handleFlameExtinguish = function(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (candleBlown) return;
        candleBlown = true;

        const tapPrevZone = document.getElementById('tapPrevZone');
        if (tapPrevZone) tapPrevZone.style.display = 'none';

        if (candleFlame) {
          candleFlame.style.opacity = '0';
          candleFlame.style.transform = 'scale(0)';
        }

        if (smokeWisp) {
          smokeWisp.classList.remove('hidden');
          smokeWisp.classList.add('smoke-vanish');
        }

        // 吹熄瞬間，主配樂平滑淡出 (0.5s)，讓位給台東煙火原聲
        if (bgAudio && !bgAudio.paused) {
          let bVol = bgAudio.volume;
          const bFadeOut = setInterval(() => {
            bVol = Math.max(0, bVol - 0.12);
            bgAudio.volume = bVol;
            if (bVol <= 0) {
              clearInterval(bFadeOut);
              bgAudio.pause();
            }
          }, 40);
        }

        if (bloomFlash) {
          bloomFlash.style.opacity = '0.9';
          setTimeout(() => {
            bloomFlash.style.opacity = '0';
          }, 700);
        }

        if (cakeStageView) {
          cakeStageView.style.transition = 'opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1)';
          cakeStageView.style.opacity = '0';
          cakeStageView.style.transform = 'translate3d(0, 45px, 0) scale(0.96)';
        }

        setTimeout(() => {
          if (cakeStageView) cakeStageView.style.display = 'none';
          if (taitungFinaleStage) {
            taitungFinaleStage.classList.remove('hidden');
            void taitungFinaleStage.offsetWidth;
            taitungFinaleStage.classList.remove('opacity-0');
            taitungFinaleStage.classList.add('opacity-100');
            startTaitungTimeline();
          }
        }, 450);
      };

      ['click', 'touchstart', 'pointerdown'].forEach(evtType => {
        flameHitbox.addEventListener(evtType, handleFlameExtinguish, { passive: false });
      });
    }

    let currentStarColor = '#e2e8f0';

    function initStars() {
      const canvas = document.getElementById('starsCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 65; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.02 + 0.005
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.alpha += Math.sin(Date.now() * s.speed) * 0.015;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          
          ctx.fillStyle = currentStarColor;
          ctx.globalAlpha = Math.max(0.15, Math.min(0.9, s.alpha));
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    }

    function finishVideoAndEnterShow() {
      if (videoCompleted) return;
      videoCompleted = true;

      if (introVideo) {
        introVideo.pause();
      }

      if (bloomFlash) {
        bloomFlash.style.opacity = '0.9';
      }

      if (bgAudio) {
        bgAudio.volume = 0;
        bgAudio.play().then(() => {
          if (vinylIcon) vinylIcon.classList.add('vinyl-spinning');
          let currentVol = 0;
          const fadeInterval = setInterval(() => {
            currentVol = Math.min(1, currentVol + 0.08);
            bgAudio.volume = currentVol;
            if (currentVol >= 1) clearInterval(fadeInterval);
          }, 60);
        }).catch(err => console.warn('bgAudio start failed:', err));
      }

      setTimeout(() => {
        if (introCurtain) {
          introCurtain.style.opacity = '0';
          setTimeout(() => {
            introCurtain.style.display = 'none';
            if (bloomFlash) {
              bloomFlash.style.opacity = '0';
            }
          }, 500);
        }
      }, 350);
    }

    function initInteractions() {
      document.getElementById('tapPrevZone').addEventListener('click', () => {
        switchScene(currentIndex - 1);
      });

      document.getElementById('tapNextZone').addEventListener('click', () => {
        switchScene(currentIndex + 1);
      });

      let startX = 0;
      let startY = 0;

      window.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        const diffY = e.changedTouches[0].clientY - startY;

        if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            if (currentIndex < CONFIG.scenes.length - 1) {
              switchScene(currentIndex + 1);
            }
          } else {
            if (currentIndex === 16 && !candleBlown) {
              switchScene(15);
            } else if (currentIndex > 0 && currentIndex < 16) {
              switchScene(currentIndex - 1);
            }
          }
        }
      }, { passive: true });

      musicToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (bgAudio.paused) {
          bgAudio.play().then(() => {
            vinylIcon.classList.add('vinyl-spinning');
          }).catch(() => {});
        } else {
          bgAudio.pause();
          vinylIcon.classList.remove('vinyl-spinning');
        }
      });

      startCinemaBtn.addEventListener('click', () => {
        ticketCoverView.style.opacity = '0';
        setTimeout(() => {
          ticketCoverView.style.display = 'none';
          videoContainer.style.opacity = '1';
          videoContainer.style.pointerEvents = 'auto';

          introVideo.currentTime = 0;
          introVideo.play().catch(err => {
            console.warn('Video auto-play restricted, jumping directly:', err);
            finishVideoAndEnterShow();
          });
        }, 400);
      });

      introVideo.addEventListener('ended', () => {
        finishVideoAndEnterShow();
      });

      skipVideoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        finishVideoAndEnterShow();
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initScenes();
      initStars();
      initInteractions();
    });
  </script>
</body>
