<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>佳寶寶 · 生日快樂 ✦ Happy Birthday</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+TC:wght@300;400;600;900&family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      /* 全域動態電影色度引擎變數 */
      --current-accent: #e2e8f0;
      --current-glow: rgba(226, 232, 240, 0.45);
      --current-bg: #03070c;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--current-bg);
      color: #ffffff;
      font-family: 'Noto Serif TC', serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .font-sans-modern { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-code { font-family: 'Space Mono', monospace; }

    /* 電影級純文字立體浮水印投影 (徹底去卡片化) */
    .watermark-text {
      text-shadow: 
        0 2px 10px rgba(0, 0, 0, 0.95),
        0 4px 24px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(0, 0, 0, 0.85);
    }

    .watermark-subtle {
      text-shadow: 
        0 1px 6px rgba(0, 0, 0, 0.9),
        0 2px 14px rgba(0, 0, 0, 0.85);
    }

    /* 王家衛式直書縱排樣式 */
    .vertical-text-layout {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    /* 漫威經典片頭品牌字標容器 */
    .marvel-brand-card {
      position: relative;
      background: #020b0e;
      border: 3px solid #ffffff;
      box-shadow: 
        0 0 30px rgba(10, 186, 181, 0.4),
        0 15px 45px rgba(0, 0, 0, 0.9),
        inset 0 0 25px rgba(0, 0, 0, 0.8);
    }

    /* 漫威字母剪影內部動態透光翻頁 */
    .marvel-giant-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      letter-spacing: -0.06em;
      background-size: cover;
      background-position: center;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.9));
      transition: background-image 0.04s linear;
    }

    /* 膠卷掃描線與微微顆粒 */
    .marvel-scanlines {
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.35) 3px,
        rgba(0, 0, 0, 0.35) 4px
      );
    }

    /* 電影級舞台過渡動態 */
    .cinema-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1), transform 0.95s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }

    .scene-active {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translate3d(0, 0, 0) !important;
      z-index: 20;
    }

    .exit-zoom-out {
      opacity: 0 !important;
      transform: translate3d(0, 0, 0) !important;
    }

    .exit-slide-left {
      opacity: 0 !important;
      transform: translate3d(-4%, 0, 0) !important;
    }

    .enter-zoom-in {
      opacity: 0;
      transform: translate3d(0, 0, 0);
    }

    .enter-slide-right {
      transform: translate3d(4%, 0, 0);
    }

    /* 燭火真實呼吸動態 */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 16px #fbbf24); }
      30% { transform: scale(1.08, 0.95) rotate(2deg); filter: drop-shadow(0 0 24px #f59e0b); }
      60% { transform: scale(0.96, 1.05) rotate(-2deg); filter: drop-shadow(0 0 20px #d97706); }
      85% { transform: scale(1.04, 0.98) rotate(1deg); filter: drop-shadow(0 0 26px #fde68a); }
    }

    .flame-on {
      animation: flameFlicker 1.8s infinite ease-in-out;
      transform-origin: center bottom;
    }

    /* 白煙消散動態 */
    @keyframes smokeDrift {
      0% { opacity: 0.95; transform: translateY(0) scale(1) filter(blur(1px)); }
      50% { opacity: 0.6; transform: translateY(-35px) scale(1.6) filter(blur(4px)); }
      100% { opacity: 0; transform: translateY(-80px) scale(2.4) filter(blur(8px)); }
    }

    .smoke-vanish {
      animation: smokeDrift 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 黑膠旋轉動畫 */
    @keyframes vinylSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vinyl-spinning {
      animation: vinylSpin 7s linear infinite;
    }

    .safe-top-inset {
      padding-top: max(var(--safe-top), 16px);
    }

    .safe-bottom-inset {
      padding-bottom: max(var(--safe-bottom), 16px);
    }

    /* 來回平滑鐘擺呼吸捲動膠卷 (Ping-Pong Reel) */
    .panoramic-reel-wrapper {
      position: relative;
      width: 100vw;
      margin-left: -1rem;
      margin-right: -1rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 0;
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .panoramic-reel-wrapper::-webkit-scrollbar {
      display: none;
    }

    .panoramic-reel-track {
      display: flex;
      gap: 10px;
      width: max-content;
      padding: 0 1.25rem;
      animation: panFilmReelPingPong 26s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
      will-change: transform;
    }

    .panoramic-reel-track:active {
      animation-play-state: paused;
    }

    @keyframes panFilmReelPingPong {
      0% { transform: translate3d(0, 0, 0); }
      6% { transform: translate3d(0, 0, 0); }
      94% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      100% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
    }

    .film-frame-card {
      position: relative;
      width: 84px;
      height: 114px;
      border-radius: 4px;
      background: #02090c;
      border: 1px solid rgba(10, 186, 181, 0.55);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8), 0 0 12px rgba(10, 186, 181, 0.25);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px;
    }

    /* 導演暗房工作台 · 雙軌錯落光影印樣 */
    .contact-reel-container {
      width: 100vw;
      margin-left: -1rem;
      margin-right: -1rem;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
      padding: 3px 0;
    }

    .contact-reel-container::-webkit-scrollbar {
      display: none;
    }

    .contact-reel-track-a {
      display: flex;
      gap: 12px;
      width: max-content;
      padding: 0 1.25rem;
      animation: contactReelDriftA 22s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
      will-change: transform;
    }

    .contact-reel-track-b {
      display: flex;
      gap: 12px;
      width: max-content;
      padding: 0 1.25rem;
      animation: contactReelDriftB 24s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
      will-change: transform;
    }

    .contact-reel-track-a:active, .contact-reel-track-b:active {
      animation-play-state: paused;
    }

    @keyframes contactReelDriftA {
      0% { transform: translate3d(0, 0, 0); }
      8% { transform: translate3d(0, 0, 0); }
      92% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      100% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
    }

    @keyframes contactReelDriftB {
      0% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      8% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      92% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .contact-film-card {
      position: relative;
      width: 124px;
      height: 94px;
      background: #02090c;
      border: 1px solid rgba(10, 186, 181, 0.45);
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px 4px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.85), inset 0 0 10px rgba(0, 0, 0, 0.7);
    }

    @keyframes darkroomEnter {
      0% { opacity: 0; transform: scale(0.95); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0px); }
    }

    .darkroom-active-enter {
      animation: darkroomEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 火苗呼吸微光光圈 */
    @keyframes beaconGlow {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.35); opacity: 0.25; }
    }

    .beacon-pulse {
      animation: beaconGlow 1.8s ease-in-out infinite;
    }

    /* 動態環境呼吸光暈 (換幕時平滑轉色) */
    .ambient-dynamic-halo {
      background: radial-gradient(circle at center, var(--current-glow) 0%, transparent 75%);
      transition: background 1s ease-in-out;
    }
  </style>
</head>

<body class="w-screen h-[100dvh] overflow-hidden select-none">

  <!-- 音訊引擎：優先加載本地 bgm.mp3，備用線上鋼琴曲 -->
  <audio id="bgAudio" loop playsinline preload="auto">
    <source src="./bgm.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
  </audio>

  <!-- 全螢幕動態環境光暈層 (換幕時全螢幕色溫同步轉變) -->
  <div id="dynamicAmbientLayer" class="absolute inset-0 w-full h-full pointer-events-none z-[5] ambient-dynamic-halo"></div>

  <!-- 全螢幕背景粒子畫布 -->
  <canvas id="starsCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
  <canvas id="fireworksCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-40"></canvas>

  <!-- 電影高光轉場光暈 (吹熄火苗時爆發) -->
  <div id="bloomFlash" class="fixed inset-0 bg-[#f0fdfa] pointer-events-none z-[80] opacity-0 transition-opacity duration-700"></div>

  <!-- 開場解鎖布幕：漫威影業經典時光翻頁大片開場 (Marvel Studios Flipbook Overture) -->
  <div id="introCurtain" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#010609] px-4 text-center transition-opacity duration-1000 overflow-hidden">
    
    <!-- 2.35:1 經典電影寬銀幕上下黑邊遮罩 (Cinematic Letterbox) -->
    <div class="absolute top-0 inset-x-0 h-11 md:h-16 bg-black pointer-events-none z-20 border-b border-teal-500/15"></div>
    <div class="absolute bottom-0 inset-x-0 h-11 md:h-16 bg-black pointer-events-none z-20 border-t border-teal-500/15"></div>
    
    <!-- 橫貫銀幕中心的冷青微光變形光斑線條 (Anamorphic Line) -->
    <div class="absolute w-full h-[1px] bg-gradient-to-r from-transparent via-teal-400/35 to-transparent pointer-events-none z-10"></div>

    <!-- 漫威影業大片核心展示卡 -->
    <div class="relative z-20 flex flex-col items-center w-full max-w-sm">
      
      <!-- 頂部出品人標記 -->
      <div class="flex items-center gap-2 mb-3.5 opacity-90">
        <span class="w-6 h-[1px] bg-teal-400/60"></span>
        <span class="text-[9px] font-mono tracking-[0.45em] text-teal-300 uppercase font-semibold">EXCLUSIVE PRODUCTION</span>
        <span class="w-6 h-[1px] bg-teal-400/60"></span>
      </div>

      <!-- 漫威經典巨型品牌字標框體 (MARVEL BOX) -->
      <div class="marvel-brand-card relative rounded-[2px] overflow-hidden px-6 py-3 mb-2 w-[86vw] max-w-[310px]">
        
        <!-- 底層極速抽幀照片背景 (微模糊營造整體動感) -->
        <div id="marvelFlipbookTrack" class="absolute inset-0 w-full h-full bg-cover bg-center filter brightness-90 contrast-125 opacity-35 pointer-events-none"></div>
        
        <!-- 復古掃描線與顆粒質感 -->
        <div class="marvel-scanlines absolute inset-0 pointer-events-none"></div>

        <!-- 漫威核心字母：JIA (字母內部以超高幀率狂飆抽幀翻頁) -->
        <div class="relative z-10 flex items-center justify-center">
          <h1 id="marvelGiantTitle" class="marvel-giant-text text-6xl md:text-7xl uppercase leading-none select-none py-1">
            JIA
          </h1>
        </div>
      </div>

      <!-- 漫威下層標誌性紅/青金屬銘牌條：STUDIOS -->
      <div class="flex items-center justify-between w-[86vw] max-w-[310px] px-1 mb-4">
        <div class="h-[1.5px] flex-1 bg-white/80"></div>
        <div class="px-3.5 py-0.5 text-[10px] md:text-[11px] font-black font-sans-modern tracking-[0.45em] text-white uppercase bg-teal-600/90 rounded-[2px] shadow-[0_0_15px_#0abab5]">
          STUDIOS
        </div>
        <div class="h-[1.5px] flex-1 bg-white/80"></div>
      </div>

      <!-- 漫威官方副標題與時間線 -->
      <div class="text-[10px] font-mono tracking-[0.3em] text-teal-200/90 uppercase mb-1.5 watermark-subtle">
        A PRIVATE SCREENING FOR MY LOVE
      </div>
      <div class="text-[9px] font-mono tracking-[0.25em] text-slate-400 mb-8 watermark-subtle">
        SINCE 2025.12.22 · 17 CHAPTERS
      </div>

      <!-- 漫威院線首映按鈕 (Premier Pass) -->
      <button id="startCinemaBtn" class="group relative px-9 py-3 rounded-sm bg-gradient-to-r from-teal-400 via-teal-300 to-cyan-300 text-slate-950 font-sans-modern text-xs tracking-[0.3em] font-black shadow-[0_0_35px_rgba(10,186,181,0.55)] hover:shadow-[0_0_45px_rgba(10,186,181,0.8)] active:scale-95 transition-all flex items-center gap-2.5 cursor-pointer border border-white/70">

        <span class="uppercase">首映入座 · PREMIERE</span>
      </button>
    </div>
  </div>

  <!-- 頂部進度條與電影導覽列 (顏色隨每幕動態過渡) -->
  <div class="fixed top-0 inset-x-0 z-30 flex flex-col safe-top-inset px-4 pointer-events-none">
    <!-- 17 段分段進度條 -->
    <div id="timelineProgressTrack" class="flex gap-1 w-full pt-2"></div>

    <div class="flex items-center justify-between mt-2.5 px-0.5">
      <div id="sceneBadge" class="text-[11px] font-sans-modern tracking-widest font-medium watermark-subtle transition-colors duration-700">

      <!-- 音樂開關按鈕 -->
      <button id="musicToggleBtn" class="pointer-events-auto flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900/60 backdrop-blur-md border border-white/20 text-white active:scale-95 transition-all">
        <div id="vinylIcon" class="w-3.5 h-3.5 rounded-full border border-teal-300/70 flex items-center justify-center vinyl-spinning">
          <div id="vinylCenter" class="w-1 h-1 rounded-full bg-teal-300"></div>
        </div>
        <span class="text-[10px] font-sans-modern tracking-wider">BGM</span>
      </button>
    </div>
  </div>

  <!-- 電影舞台容器 -->
  <main id="cinematicStage" class="relative w-full h-full overflow-hidden"></main>

    function updateDynamicTheme(index) {
      const scene = CONFIG.scenes[index];
      if (!scene) return;

      const accent = scene.accent || '#e2e8f0';
      const glow = scene.glow || 'rgba(226, 232, 240, 0.45)';
      const bg = scene.bg || '#03070c';

      document.documentElement.style.setProperty('--current-accent', accent);
      document.documentElement.style.setProperty('--current-glow', glow);
      document.documentElement.style.setProperty('--current-bg', bg);
      document.body.style.backgroundColor = bg;

      document.querySelectorAll('#timelineProgressTrack > div').forEach((bar, idx) => {
        if (idx <= index) {
          bar.style.backgroundColor = accent;
          bar.style.boxShadow = `0 0 10px ${accent}`;
          bar.style.opacity = '1';
        } else {
          bar.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
          bar.style.boxShadow = 'none';
          bar.style.opacity = '0.3';
        }
      });

      sceneBadge.textContent = `SCENE ${String(index + 1).padStart(2, '0')} / ${String(CONFIG.scenes.length).padStart(2, '0')}`;
      sceneBadge.style.color = accent;

      if (vinylCenter) {
        vinylCenter.style.backgroundColor = accent;
      }
      if (vinylIcon) {
        vinylIcon.style.borderColor = accent;
      }

      currentStarColor = accent;
    }

    function switchScene(nextIndex) {
      if (isTransitioning) return;
      if (nextIndex < 0 || nextIndex >= CONFIG.scenes.length || nextIndex === currentIndex) return;

      isTransitioning = true;
      const currentEl = document.getElementById(`scene-${currentIndex}`);
      const nextEl = document.getElementById(`scene-${nextIndex}`);

      const tapPrevZone = document.getElementById('tapPrevZone');
      const tapNextZone = document.getElementById('tapNextZone');
      if (CONFIG.scenes[nextIndex].type === 'finale') {
        if (tapPrevZone) tapPrevZone.style.display = 'none';
        if (tapNextZone) tapNextZone.style.display = 'none';
      } else {
        if (tapPrevZone) tapPrevZone.style.display = 'block';
        if (tapNextZone) tapNextZone.style.display = 'block';
      }

      const isForward = nextIndex > currentIndex;
      currentEl.className = 'cinema-stage';
      currentEl.classList.add(isForward ? 'exit-slide-left' : 'exit-zoom-out');

      nextEl.className = 'cinema-stage';
      nextEl.classList.add(isForward ? 'enter-slide-right' : 'enter-zoom-in');

      void nextEl.offsetWidth;
      requestAnimationFrame(() => {
        nextEl.classList.add('scene-active');
      });

      updateDynamicTheme(nextIndex);

      if (CONFIG.scenes[nextIndex].type === 'finale') {
        bindCandleEvent();
      }

      currentIndex = nextIndex;

      setTimeout(() => {
        isTransitioning = false;
      }, 950);
    }

    function bindCandleEvent() {
      const flameHitbox = document.getElementById('flameHitbox');
      const candleFlame = document.getElementById('candleFlame');
      const smokeWisp = document.getElementById('smokeWisp');
      const bloomFlash = document.getElementById('bloomFlash');
      const cakeStageView = document.getElementById('cakeStageView');
      const grandDarkroomStage = document.getElementById('grandDarkroomStage');

      if (!flameHitbox || candleBlown) return;

      const handleFlameExtinguish = function(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (candleBlown) return;
        candleBlown = true;

        if (candleFlame) {
          candleFlame.style.opacity = '0';
          candleFlame.style.transform = 'scale(0)';
        }

        if (smokeWisp) {
          smokeWisp.classList.remove('hidden');
          smokeWisp.classList.add('smoke-vanish');
        }

        if (bloomFlash) {
          bloomFlash.style.opacity = '0.95';
          setTimeout(() => {
            bloomFlash.style.opacity = '0';
          }, 650);
        }

        setTimeout(() => {
          if (cakeStageView) {
            cakeStageView.style.display = 'none';
          }
          if (grandDarkroomStage) {
            grandDarkroomStage.classList.remove('hidden');
            grandDarkroomStage.classList.add('darkroom-active-enter');
          }

          triggerGrandFireworks();
          setTimeout(() => triggerGrandFireworks(), 1500);
          setTimeout(() => triggerGrandFireworks(), 3000);
        }, 380);
      };

      ['click', 'touchstart', 'pointerdown'].forEach(evtType => {
        flameHitbox.addEventListener(evtType, handleFlameExtinguish, { passive: false });
      });
    }

    let currentStarColor = '#e2e8f0';

    function initStars() {
      const canvas = document.getElementById('starsCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 65; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.02 + 0.005
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.alpha += Math.sin(Date.now() * s.speed) * 0.015;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          
          ctx.fillStyle = currentStarColor;
          ctx.globalAlpha = Math.max(0.15, Math.min(0.9, s.alpha));
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    }

    let particles = [];
    let fireworksCanvas, fCtx;

    function initFireworksCanvas() {
      fireworksCanvas = document.getElementById('fireworksCanvas');
      fCtx = fireworksCanvas.getContext('2d');

      function resize() {
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function loop() {
        fCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
          } else {
            fCtx.save();
            fCtx.beginPath();
            fCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            fCtx.fillStyle = p.color.replace('ALP', p.alpha.toFixed(2));
            fCtx.shadowColor = p.glow;
            fCtx.shadowBlur = 12;
            fCtx.fill();
            fCtx.restore();
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    }

    function createExplosion(x, y) {
      const colors = [
        'rgba(10, 186, 181, ALP)',
        'rgba(56, 189, 248, ALP)',
        'rgba(224, 242, 254, ALP)',
        'rgba(255, 255, 255, ALP)',
        'rgba(147, 197, 253, ALP)'
      ];
      const count = 55;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
        const speed = Math.random() * 6 + 2.5;
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.08,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01,
          size: Math.random() * 2.5 + 1.2,
          color: color,
          glow: '#0abab5'
        });
      }
    }

    function triggerGrandFireworks() {
      const w = fireworksCanvas.width;
      const h = fireworksCanvas.height;
      const shots = [
        { x: w * 0.25, y: h * 0.35, delay: 0 },
        { x: w * 0.75, y: h * 0.32, delay: 250 },
        { x: w * 0.5,  y: h * 0.22, delay: 500 },
        { x: w * 0.2,  y: h * 0.45, delay: 800 },
        { x: w * 0.8,  y: h * 0.42, delay: 1100 },
        { x: w * 0.5,  y: h * 0.3,  delay: 1400 }
      ];

      shots.forEach(s => {
        setTimeout(() => {
          createExplosion(s.x, s.y);
        }, s.delay);
      });
    }

    function startMarvelFlipbook() {
      const photoUrls = CONFIG.scenes.slice(0, 16).map(s => s.photo);
      let photoIdx = 0;

      // 預設首圖
      if (marvelGiantTitle) {
        marvelGiantTitle.style.backgroundImage = `url('${photoUrls[0]}')`;
      }
      if (marvelFlipbookTrack) {
        marvelFlipbookTrack.style.backgroundImage = `url('${photoUrls[0]}')`;
      }

      // 75ms 超高速抽幀循環翻頁
      flipbookTimer = setInterval(() => {
        photoIdx = (photoIdx + 1) % photoUrls.length;
        const currentUrl = photoUrls[photoIdx];

        if (marvelGiantTitle) {
          marvelGiantTitle.style.backgroundImage = `url('${currentUrl}')`;
        }
        if (marvelFlipbookTrack) {
          marvelFlipbookTrack.style.backgroundImage = `url('${currentUrl}')`;
        }
      }, 75);
    }

    function initInteractions() {
      document.getElementById('tapPrevZone').addEventListener('click', () => {
        switchScene(currentIndex - 1);
      });

      document.getElementById('tapNextZone').addEventListener('click', () => {
        switchScene(currentIndex + 1);
      });

      let startX = 0;
      let startY = 0;

      window.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        const diffY = e.changedTouches[0].clientY - startY;

        if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            switchScene(currentIndex + 1);
          } else {
            switchScene(currentIndex - 1);
          }
        }
      }, { passive: true });

      musicToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (bgAudio.paused) {
          bgAudio.play().then(() => {
            vinylIcon.classList.add('vinyl-spinning');
          }).catch(() => {});
        } else {
          bgAudio.pause();
          vinylIcon.classList.remove('vinyl-spinning');
        }
      });

      startCinemaBtn.addEventListener('click', () => {
        // 清理抽幀定時器以釋放行動裝置運算資源
        if (flipbookTimer) {
          clearInterval(flipbookTimer);
          flipbookTimer = null;
        }

        bgAudio.play().then(() => {
          vinylIcon.classList.add('vinyl-spinning');
        }).catch(err => {
          console.warn('Audio auto-play blocked by system:', err);
        });

        introCurtain.style.opacity = '0';
        setTimeout(() => {
          introCurtain.style.display = 'none';
        }, 1000);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initScenes();
      initStars();
      initFireworksCanvas();
      initInteractions();
      startMarvelFlipbook();
    });
  </script>
</body>
</html>
