<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>佳寶寶 · 生日快樂 ✦ Happy Birthday</title>
  
  <!-- iOS PWA 獨立全螢幕 APP 沉浸配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="佳寶寶">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Noto+Serif+TC:wght@400;600;900&family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --current-accent: #e2e8f0;
      --current-glow: rgba(226, 232, 240, 0.45);
      --current-bg: #03070c;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--current-bg);
      color: #ffffff;
      font-family: 'Noto Serif TC', serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .font-sans-modern { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-code { font-family: 'Space Mono', monospace; }

    /* 電影級文字浮水印投影 */
    .watermark-text {
      text-shadow: 
        0 2px 10px rgba(0, 0, 0, 0.95),
        0 4px 24px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(0, 0, 0, 0.85);
    }

    .watermark-subtle {
      text-shadow: 
        0 1px 6px rgba(0, 0, 0, 0.9),
        0 2px 14px rgba(0, 0, 0, 0.85);
    }

    /* 王家衛式直書縱排 */
    .vertical-text-layout {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    /* 電影舞台轉場動態 */
    .cinema-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1), transform 0.95s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }

    .scene-active {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translate3d(0, 0, 0) !important;
      z-index: 20;
    }

    .exit-zoom-out { opacity: 0 !important; transform: translate3d(0, 0, 0) !important; }
    .exit-slide-left { opacity: 0 !important; transform: translate3d(-4%, 0, 0) !important; }
    .enter-zoom-in { opacity: 0; transform: translate3d(0, 0, 0); }
    .enter-slide-right { transform: translate3d(4%, 0, 0); }

    /* 燭火真實呼吸動態 */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 16px #fbbf24); }
      30% { transform: scale(1.08, 0.95) rotate(2deg); filter: drop-shadow(0 0 24px #f59e0b); }
      60% { transform: scale(0.96, 1.05) rotate(-2deg); filter: drop-shadow(0 0 20px #d97706); }
      85% { transform: scale(1.04, 0.98) rotate(1deg); filter: drop-shadow(0 0 26px #fde68a); }
    }

    .flame-on {
      animation: flameFlicker 1.8s infinite ease-in-out;
      transform-origin: center bottom;
    }

    /* 白煙消散動態 */
    @keyframes smokeDrift {
      0% { opacity: 0.95; transform: translateY(0) scale(1) filter(blur(1px)); }
      50% { opacity: 0.6; transform: translateY(-35px) scale(1.6) filter(blur(4px)); }
      100% { opacity: 0; transform: translateY(-80px) scale(2.4) filter(blur(8px)); }
    }

    .smoke-vanish { animation: smokeDrift 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* 黑膠旋轉動畫 */
    @keyframes vinylSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vinyl-spinning { animation: vinylSpin 7s linear infinite; }

    .safe-top-inset { padding-top: max(var(--safe-top), 16px); }
    .safe-bottom-inset { padding-bottom: max(var(--safe-bottom), 16px); }

    /* 鐘擺呼吸捲動膠卷 */
    .panoramic-reel-wrapper {
      position: relative;
      width: 100vw;
      margin-left: -1rem;
      margin-right: -1rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 0;
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .panoramic-reel-wrapper::-webkit-scrollbar { display: none; }

    .panoramic-reel-track {
      display: flex;
      gap: 10px;
      width: max-content;
      padding: 0 1.25rem;
      animation: panFilmReelPingPong 26s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
      will-change: transform;
    }

    .panoramic-reel-track:active { animation-play-state: paused; }

    @keyframes panFilmReelPingPong {
      0% { transform: translate3d(0, 0, 0); }
      6% { transform: translate3d(0, 0, 0); }
      94% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      100% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
    }

    .film-frame-card {
      position: relative;
      width: 84px;
      height: 114px;
      border-radius: 4px;
      background: #02090c;
      border: 1px solid rgba(10, 186, 181, 0.55);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8), 0 0 12px rgba(10, 186, 181, 0.25);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px;
    }

    /* 雙軌錯落光影印樣 */
    .contact-reel-container {
      width: 100vw;
      margin-left: -1rem;
      margin-right: -1rem;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
      padding: 3px 0;
    }

    .contact-reel-container::-webkit-scrollbar { display: none; }

    .contact-reel-track-a {
      display: flex;
      gap: 12px;
      width: max-content;
      padding: 0 1.25rem;
      animation: contactReelDriftA 22s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
      will-change: transform;
    }

    .contact-reel-track-b {
      display: flex;
      gap: 12px;
      width: max-content;
      padding: 0 1.25rem;
      animation: contactReelDriftB 24s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
      will-change: transform;
    }

    .contact-reel-track-a:active, .contact-reel-track-b:active { animation-play-state: paused; }

    @keyframes contactReelDriftA {
      0% { transform: translate3d(0, 0, 0); }
      8% { transform: translate3d(0, 0, 0); }
      92% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      100% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
    }

    @keyframes contactReelDriftB {
      0% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      8% { transform: translate3d(calc(-100% + 100vw - 2.5rem), 0, 0); }
      92% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .contact-film-card {
      position: relative;
      width: 124px;
      height: 94px;
      background: #02090c;
      border: 1px solid rgba(10, 186, 181, 0.45);
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px 4px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.85), inset 0 0 10px rgba(0, 0, 0, 0.7);
    }

    @keyframes darkroomEnter {
      0% { opacity: 0; transform: scale(0.95); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0px); }
    }

    .darkroom-active-enter {
      animation: darkroomEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes beaconGlow {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.35); opacity: 0.25; }
    }

    .beacon-pulse { animation: beaconGlow 1.8s ease-in-out infinite; }

    .ambient-dynamic-halo {
      background: radial-gradient(circle at center, var(--current-glow) 0%, transparent 75%);
      transition: background 1s ease-in-out;
    }

    /* 門票微光呼吸 */
    @keyframes ticketPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(254, 240, 138, 0.2); }
      50% { box-shadow: 0 0 45px rgba(234, 179, 8, 0.8), inset 0 0 25px rgba(254, 240, 138, 0.4); }
    }

    .ticket-glow-btn {
      animation: ticketPulse 2.8s ease-in-out infinite;
    }
  </style>
</head>

<body class="w-screen h-[100dvh] overflow-hidden select-none">

  <!-- 音訊引擎：音軌 1 (BGM 主配樂) + 音軌 2 (第 17 幕生日快樂專屬配樂) -->
  <audio id="bgAudio" loop playsinline preload="auto">
    <source src="./bgm.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
  </audio>
  <audio id="birthdayAudio" loop playsinline preload="auto">
    <source src="./birthday.mp3" type="audio/mpeg">
    <source src="https://www.orangefreesounds.com/wp-content/uploads/2018/11/Happy-birthday-piano-music.mp3" type="audio/mpeg">
  </audio>

  <!-- 全螢幕動態環境光暈層 (換幕時全螢幕色溫同步轉變) -->
  <div id="dynamicAmbientLayer" class="absolute inset-0 w-full h-full pointer-events-none z-[5] ambient-dynamic-halo"></div>

  <!-- 全螢幕背景粒子畫布與煙火畫布 -->
  <canvas id="starsCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
  <canvas id="fireworksCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-40"></canvas>

  <!-- 電影高光過曝溶鏡 (Bloom Flash) -->
  <div id="bloomFlash" class="fixed inset-0 bg-[#ffffff] pointer-events-none z-[90] opacity-0 transition-opacity duration-600"></div>

  <!-- 開場布幕：好萊塢 3D 影片播放層與特映驗票門票 -->
  <div id="introCurtain" class="fixed inset-0 z-50 flex flex-col items-center justify-between bg-[#030712] text-center overflow-hidden safe-top-inset safe-bottom-inset transition-opacity duration-700">
    
    <!-- 2.35:1 經典電影寬銀幕上下黑邊遮罩 -->
    <div class="absolute top-0 inset-x-0 h-10 md:h-14 bg-black pointer-events-none z-30 border-b border-amber-500/20 shadow-md"></div>
    <div class="absolute bottom-0 inset-x-0 h-10 md:h-14 bg-black pointer-events-none z-30 border-t border-amber-500/20 shadow-md"></div>

    <!-- 影片播放容器 (覆蓋於中央寬銀幕) -->
    <div id="videoContainer" class="absolute inset-0 z-20 flex items-center justify-center bg-black opacity-0 pointer-events-none transition-opacity duration-500">
      <video id="introVideo" 
             playsinline 
             webkit-playsinline 
             x5-playsinline 
             preload="auto"
             class="w-full h-full object-contain">
        <source src="./intro.mp4" type="video/mp4">
        您的瀏覽器不支援影片播放。
      </video>

      <!-- 影片右上角極細優雅跳過按鈕 -->
      <button id="skipVideoBtn" class="absolute top-12 md:top-16 right-5 z-40 px-3.5 py-1.5 rounded-full bg-slate-900/70 backdrop-blur-md border border-white/20 text-white/90 text-[10px] font-mono tracking-widest uppercase hover:bg-slate-800 transition-all flex items-center gap-1 cursor-pointer">
        <span>SKIP</span>
        <span>➔</span>
      </button>
    </div>

    <!-- 第一階段：首映特映驗票封面 (Ticket Landing Cover) -->
    <div id="ticketCoverView" class="relative z-20 w-full h-full flex flex-col items-center justify-between px-6 pt-10 pb-12 transition-all duration-700">
      
      <!-- 頂部獨立影展出品人題詞 -->
      <div class="flex items-center gap-3 opacity-90 mt-2">
        <span class="w-8 h-[1px] bg-gradient-to-r from-transparent to-amber-300"></span>
        <span class="text-[9.5px] font-mono tracking-[0.45em] text-amber-200 uppercase font-semibold drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]">A SPECIAL CENTURY PRODUCTION</span>
        <span class="w-8 h-[1px] bg-gradient-to-l from-transparent to-amber-300"></span>
      </div>

      <!-- 中央：好萊塢特映專屬視覺主題徽章 -->
      <div class="my-auto flex flex-col items-center max-w-sm">
        
        <div class="flex items-center gap-2 mb-2 opacity-80">
          <span class="text-amber-400 text-xs animate-pulse">✦</span>
          <span class="text-[9px] font-mono tracking-[0.38em] text-amber-100 uppercase">EXCLUSIVE PREMIERE</span>
          <span class="text-amber-400 text-xs animate-pulse">✦</span>
        </div>

        <h1 class="text-4xl md:text-5xl font-cinzel font-black text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-amber-300 to-amber-600 tracking-[0.25em] drop-shadow-[0_4px_25px_rgba(245,158,11,0.55)] leading-tight mb-2">
          JIA
        </h1>

        <div class="text-xs md:text-sm font-cinzel font-bold text-amber-200 tracking-[0.45em] uppercase mb-4 watermark-subtle">
          HAPPY BIRTHDAY
        </div>

        <!-- 電影立體銘牌飾板 -->
        <div class="w-full py-2 px-4 rounded-[3px] bg-gradient-to-r from-amber-950/60 via-black/80 to-amber-950/60 border border-amber-500/40 shadow-inner flex flex-col items-center">
          <div class="text-[11px] font-serif font-bold text-amber-100 tracking-[0.22em]">
            我 最 愛 的 女 主 角
          </div>
          <div class="text-[8px] font-mono text-amber-400/80 tracking-[0.25em] mt-0.5 uppercase">
            HOLLYWOOD MAJESTY // SINCE 2025.12.22
          </div>
        </div>
      </div>

      <!-- 底部：金色電影門票入場通行按鈕 (點擊解鎖音效與影片) -->
      <div class="w-full flex flex-col items-center mb-4">
        <button id="startCinemaBtn" class="ticket-glow-btn group relative px-10 py-3 rounded-full bg-gradient-to-r from-amber-600 via-yellow-400 to-amber-600 border border-yellow-200 text-slate-950 font-sans-modern font-black text-[12px] tracking-[0.38em] active:scale-95 transition-all flex items-center gap-2.5 cursor-pointer">

        </button>
        <span class="text-[8px] font-mono text-amber-300/60 tracking-[0.25em] mt-2 uppercase">TAP TO COMMENCE OVERTURE</span>
      </div>
    </div>
  </div>

  <!-- 頂部進度條與導覽列 -->
  <div class="fixed top-0 inset-x-0 z-30 flex flex-col safe-top-inset px-4 pointer-events-none">
    <div id="timelineProgressTrack" class="flex gap-1 w-full pt-2"></div>

    <div class="flex items-center justify-between mt-2.5 px-0.5">
      <div id="sceneBadge" class="text-[11px] font-sans-modern tracking-widest font-medium watermark-subtle transition-colors duration-700">
        SCENE 01 / 17
      </div>

      <!-- 音樂開關按鈕 -->
      <button id="musicToggleBtn" class="pointer-events-auto flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900/60 backdrop-blur-md border border-white/20 text-white active:scale-95 transition-all">
        <div id="vinylIcon" class="w-3.5 h-3.5 rounded-full border border-teal-300/70 flex items-center justify-center vinyl-spinning">
          <div id="vinylCenter" class="w-1 h-1 rounded-full bg-teal-300"></div>
        </div>
        <span class="text-[10px] font-sans-modern tracking-wider">BGM</span>
      </button>
    </div>
  </div>

  <main id="cinematicStage" class="relative w-full h-full overflow-hidden"></main>

        const sceneEl = document.createElement('section');
        sceneEl.id = `scene-${index}`;

    function updateDynamicTheme(index) {
      const scene = CONFIG.scenes[index];
      if (!scene) return;

      const accent = scene.accent || '#e2e8f0';
      const glow = scene.glow || 'rgba(226, 232, 240, 0.45)';
      const bg = scene.bg || '#03070c';

      document.documentElement.style.setProperty('--current-accent', accent);
      document.documentElement.style.setProperty('--current-glow', glow);
      document.documentElement.style.setProperty('--current-bg', bg);
      document.body.style.backgroundColor = bg;

      document.querySelectorAll('#timelineProgressTrack > div').forEach((bar, idx) => {
        if (idx <= index) {
          bar.style.backgroundColor = accent;
          bar.style.boxShadow = `0 0 10px ${accent}`;
          bar.style.opacity = '1';
        } else {
          bar.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
          bar.style.boxShadow = 'none';
          bar.style.opacity = '0.3';
        }
      });

      sceneBadge.textContent = `SCENE ${String(index + 1).padStart(2, '0')} / ${String(CONFIG.scenes.length).padStart(2, '0')}`;
      sceneBadge.style.color = accent;

      if (vinylCenter) vinylCenter.style.backgroundColor = accent;
      if (vinylIcon) vinylIcon.style.borderColor = accent;

      currentStarColor = accent;
    }

    function switchScene(nextIndex) {
      if (isTransitioning) return;
      if (nextIndex < 0 || nextIndex >= CONFIG.scenes.length || nextIndex === currentIndex) return;

      isTransitioning = true;
      const currentEl = document.getElementById(`scene-${currentIndex}`);
      const nextEl = document.getElementById(`scene-${nextIndex}`);

      const tapPrevZone = document.getElementById('tapPrevZone');
      const tapNextZone = document.getElementById('tapNextZone');
      if (CONFIG.scenes[nextIndex].type === 'finale') {
        if (tapPrevZone) tapPrevZone.style.display = 'none';
        if (tapNextZone) tapNextZone.style.display = 'none';
      } else {
        if (tapPrevZone) tapPrevZone.style.display = 'block';
        if (tapNextZone) tapNextZone.style.display = 'block';
      }

      const isForward = nextIndex > currentIndex;
      currentEl.className = 'cinema-stage';
      currentEl.classList.add(isForward ? 'exit-slide-left' : 'exit-zoom-out');

      nextEl.className = 'cinema-stage';
      nextEl.classList.add(isForward ? 'enter-slide-right' : 'enter-zoom-in');

      void nextEl.offsetWidth;
      requestAnimationFrame(() => {
        nextEl.classList.add('scene-active');
      });

      updateDynamicTheme(nextIndex);

      if (CONFIG.scenes[nextIndex].type === 'finale') {
        crossfadeAudio(bgAudio, birthdayAudio, 1500);
        bindCandleEvent();
      } else if (CONFIG.scenes[currentIndex].type === 'finale') {
        crossfadeAudio(birthdayAudio, bgAudio, 1500);
      }

      currentIndex = nextIndex;

      setTimeout(() => {
        isTransitioning = false;
      }, 950);
    }

    function bindCandleEvent() {
      const flameHitbox = document.getElementById('flameHitbox');
      const candleFlame = document.getElementById('candleFlame');
      const smokeWisp = document.getElementById('smokeWisp');
      const bloomFlash = document.getElementById('bloomFlash');
      const cakeStageView = document.getElementById('cakeStageView');
      const grandDarkroomStage = document.getElementById('grandDarkroomStage');

      if (!flameHitbox || candleBlown) return;

      const handleFlameExtinguish = function(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (candleBlown) return;
        candleBlown = true;

        if (candleFlame) {
          candleFlame.style.opacity = '0';
          candleFlame.style.transform = 'scale(0)';
        }

        if (smokeWisp) {
          smokeWisp.classList.remove('hidden');
          smokeWisp.classList.add('smoke-vanish');
        }

        if (bloomFlash) {
          bloomFlash.style.opacity = '0.95';
          setTimeout(() => {
            bloomFlash.style.opacity = '0';
          }, 650);
        }

        setTimeout(() => {
          if (cakeStageView) cakeStageView.style.display = 'none';
          if (grandDarkroomStage) {
            grandDarkroomStage.classList.remove('hidden');
            grandDarkroomStage.classList.add('darkroom-active-enter');
          }

          triggerGrandFireworks();
          setTimeout(() => triggerGrandFireworks(), 1500);
          setTimeout(() => triggerGrandFireworks(), 3000);
        }, 380);
      };

      ['click', 'touchstart', 'pointerdown'].forEach(evtType => {
        flameHitbox.addEventListener(evtType, handleFlameExtinguish, { passive: false });
      });
    }

    let currentStarColor = '#e2e8f0';

    function initStars() {
      const canvas = document.getElementById('starsCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 65; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.02 + 0.005
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.alpha += Math.sin(Date.now() * s.speed) * 0.015;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          
          ctx.fillStyle = currentStarColor;
          ctx.globalAlpha = Math.max(0.15, Math.min(0.9, s.alpha));
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    }

    let particles = [];
    let rockets = [];
    let confetti = [];
    let fireworksCanvas, fCtx;
    let skyFlashAlpha = 0;

    function initFireworksCanvas() {
      fireworksCanvas = document.getElementById('fireworksCanvas');
      fCtx = fireworksCanvas.getContext('2d');

      function resize() {
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function loop() {
        fCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

        if (skyFlashAlpha > 0) {
          fCtx.save();
          fCtx.fillStyle = `rgba(10, 186, 181, ${skyFlashAlpha.toFixed(2)})`;
          fCtx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
          fCtx.restore();
          skyFlashAlpha *= 0.88;
          if (skyFlashAlpha < 0.01) skyFlashAlpha = 0;
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.x += r.vx;
          r.y += r.vy;
          r.vy += 0.04;

          fCtx.save();
          fCtx.beginPath();
          fCtx.arc(r.x, r.y, 2, 0, Math.PI * 2);
          fCtx.fillStyle = '#ffffff';
          fCtx.shadowColor = '#0abab5';
          fCtx.shadowBlur = 10;
          fCtx.fill();
          fCtx.restore();

          if (r.vy >= -0.5 || r.y <= r.targetY) {
            createExplosion(r.x, r.y, r.type);
            rockets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= p.drag;
          p.vy = p.vy * p.drag + p.gravity;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
          } else {
            fCtx.save();
            fCtx.beginPath();
            fCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            fCtx.fillStyle = p.color.replace('ALP', Math.max(0, p.alpha).toFixed(2));
            fCtx.shadowColor = p.glow;
            fCtx.shadowBlur = p.isWillow ? 8 : 14;
            fCtx.fill();
            fCtx.restore();
          }
        }

        for (let i = confetti.length - 1; i >= 0; i--) {
          const c = confetti[i];
          c.x += Math.sin(c.wobble) * 1.2;
          c.y += c.speedY;
          c.wobble += c.wobbleSpeed;
          c.rotation += c.rotSpeed;
          c.alpha -= c.decay;

          if (c.y > fireworksCanvas.height || c.alpha <= 0) {
            confetti.splice(i, 1);
          } else {
            fCtx.save();
            fCtx.translate(c.x, c.y);
            fCtx.rotate(c.rotation);
            fCtx.fillStyle = c.color.replace('ALP', Math.max(0, c.alpha).toFixed(2));
            fCtx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
            fCtx.restore();
          }
        }

        requestAnimationFrame(loop);
      }
      loop();
    }

    function launchRocket(targetX, targetY, type = 'peony') {
      const startX = targetX + (Math.random() * 40 - 20);
      const startY = fireworksCanvas.height + 10;
      const vy = -(Math.sqrt(2 * 0.08 * (startY - targetY)) * 0.98);
      rockets.push({
        x: startX,
        y: startY,
        vx: (targetX - startX) / 35,
        vy: vy,
        targetY: targetY,
        type: type
      });
    }

    function createExplosion(x, y, type = 'peony') {
      skyFlashAlpha = 0.22;

      const tiffanyColors = [
        'rgba(10, 186, 181, ALP)',
        'rgba(56, 189, 248, ALP)',
        'rgba(224, 242, 254, ALP)',
        'rgba(255, 255, 255, ALP)',
        'rgba(147, 197, 253, ALP)'
      ];

      const willowColors = [
        'rgba(251, 191, 36, ALP)',
        'rgba(253, 230, 138, ALP)',
        'rgba(245, 158, 11, ALP)',
        'rgba(255, 255, 255, ALP)'
      ];

      if (type === 'willow') {
        const count = 75;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 / count) * i + Math.random() * 0.15;
          const speed = Math.random() * 5.5 + 1.5;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            drag: 0.96,
            gravity: 0.055,
            alpha: 1,
            decay: Math.random() * 0.008 + 0.007,
            size: Math.random() * 2 + 1,
            color: willowColors[Math.floor(Math.random() * willowColors.length)],
            glow: '#fbbf24',
            isWillow: true
          });
        }
      } else {
        const count = 65;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
          const speed = Math.random() * 6.5 + 2.5;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            drag: 0.95,
            gravity: 0.045,
            alpha: 1,
            decay: Math.random() * 0.016 + 0.01,
            size: Math.random() * 2.6 + 1.2,
            color: tiffanyColors[Math.floor(Math.random() * tiffanyColors.length)],
            glow: '#0abab5',
            isWillow: false
          });
        }
      }

      spawnConfettiShower(x, y);
    }

    function spawnConfettiShower(originX, originY) {
      const count = 22;
      const confColors = [
        'rgba(251, 191, 36, ALP)',
        'rgba(10, 186, 181, ALP)',
        'rgba(244, 244, 245, ALP)',
        'rgba(253, 230, 138, ALP)'
      ];

      for (let i = 0; i < count; i++) {
        confetti.push({
          x: originX + (Math.random() * 120 - 60),
          y: originY + (Math.random() * 60 - 30),
          speedY: Math.random() * 1.8 + 0.8,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: Math.random() * 0.05 + 0.02,
          rotation: Math.random() * Math.PI,
          rotSpeed: Math.random() * 0.04 - 0.02,
          size: Math.random() * 5 + 3,
          color: confColors[Math.floor(Math.random() * confColors.length)],
          alpha: 1,
          decay: Math.random() * 0.004 + 0.002
        });
      }
    }

    function triggerGrandFireworks() {
      const w = fireworksCanvas.width;
      const h = fireworksCanvas.height;

      const timeline = [
        { x: w * 0.3,  y: h * 0.32, delay: 0,    type: 'peony' },
        { x: w * 0.7,  y: h * 0.28, delay: 350,  type: 'peony' },
        { x: w * 0.5,  y: h * 0.22, delay: 900,  type: 'willow' },
        { x: w * 0.22, y: h * 0.38, delay: 1600, type: 'peony' },
        { x: w * 0.78, y: h * 0.35, delay: 2100, type: 'peony' },
        { x: w * 0.45, y: h * 0.20, delay: 2800, type: 'willow' },
        { x: w * 0.55, y: h * 0.25, delay: 3200, type: 'peony' }
      ];

      timeline.forEach(item => {
        setTimeout(() => {
          launchRocket(item.x, item.y, item.type);
        }, item.delay);
      });
    }

    function crossfadeAudio(fromAudio, toAudio, durationMs = 1500) {
      if (!fromAudio || !toAudio) return;
      clearInterval(audioFadeInterval);

      const stepTime = 50;
      const steps = durationMs / stepTime;
      let currentStep = 0;

      toAudio.volume = 0;
      toAudio.play().catch(e => console.warn('toAudio play err:', e));

      audioFadeInterval = setInterval(() => {
        currentStep++;
        const progress = currentStep / steps;

        fromAudio.volume = Math.max(0, 1 - progress);
        toAudio.volume = Math.min(1, progress);

        if (currentStep >= steps) {
          clearInterval(audioFadeInterval);
          fromAudio.pause();
          fromAudio.volume = 1;
          toAudio.volume = 1;
        }
      }, stepTime);
    }

    function finishVideoAndEnterShow() {
      if (videoCompleted) return;
      videoCompleted = true;

      // 影片暫停
      if (introVideo) {
        introVideo.pause();
      }

      // 白光過曝溶鏡 (Bloom Flash)
      if (bloomFlash) {
        bloomFlash.style.opacity = '1';
      }

      // 啟動 BGM 配樂
      if (bgAudio) {
        bgAudio.volume = 1;
        bgAudio.play().then(() => {
          if (vinylIcon) vinylIcon.classList.add('vinyl-spinning');
        }).catch(err => console.warn('bgAudio start failed:', err));
      }

      setTimeout(() => {
        if (introCurtain) {
          introCurtain.style.opacity = '0';
          setTimeout(() => {
            introCurtain.style.display = 'none';
            if (bloomFlash) {
              bloomFlash.style.opacity = '0';
            }
          }, 500);
        }
      }, 350);
    }

    function initInteractions() {
      document.getElementById('tapPrevZone').addEventListener('click', () => {
        switchScene(currentIndex - 1);
      });

      document.getElementById('tapNextZone').addEventListener('click', () => {
        switchScene(currentIndex + 1);
      });

      let startX = 0;
      let startY = 0;

      window.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        const diffY = e.changedTouches[0].clientY - startY;

        if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            switchScene(currentIndex + 1);
          } else {
            switchScene(currentIndex - 1);
          }
        }
      }, { passive: true });

      musicToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const activeAudio = (CONFIG.scenes[currentIndex] && CONFIG.scenes[currentIndex].type === 'finale') ? birthdayAudio : bgAudio;
        if (activeAudio.paused) {
          activeAudio.play().then(() => {
            vinylIcon.classList.add('vinyl-spinning');
          }).catch(() => {});
        } else {
          activeAudio.pause();
          vinylIcon.classList.remove('vinyl-spinning');
        }
      });

      // 點擊特映門票入場：啟動影片播放
      startCinemaBtn.addEventListener('click', () => {
        // 隱藏封面
        ticketCoverView.style.opacity = '0';
        setTimeout(() => {
          ticketCoverView.style.display = 'none';
          videoContainer.style.opacity = '1';
          videoContainer.style.pointerEvents = 'auto';

          // 啟動 intro.mp4 影片播放 (帶聲音)
          introVideo.currentTime = 0;
          introVideo.play().catch(err => {
            console.warn('Video auto-play restricted, jumping directly:', err);
            finishVideoAndEnterShow();
          });
        }, 400);
      });

      // 監聽影片播放結束
      introVideo.addEventListener('ended', () => {
        finishVideoAndEnterShow();
      });

      // 跳過按鈕
      skipVideoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        finishVideoAndEnterShow();
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initScenes();
      initStars();
      initFireworksCanvas();
      initInteractions();
    });
  </script>
</body>
